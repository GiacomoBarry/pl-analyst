[project]
name = "pl-analyst"
version = "0.1.0"
description = "Premier League analytics service with a Claude agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
pl-analyst = "pl_analyst:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
